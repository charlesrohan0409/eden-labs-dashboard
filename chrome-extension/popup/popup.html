<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Eden Labs — Extension</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* NOTE ON "GLASS": a browser action popup has nothing behind it to blur,
       so backdrop-filter here would do literally nothing. The glass look is
       instead built the way it actually reads — layered translucency over a
       soft gradient ground, hairline light borders, and generous rounding.
       The overlay on LinkedIn (overlay.js) uses real backdrop-filter, since
       there IS a page behind it. */
    body {
      width: 440px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #1c1917;
      font-size: 14px;
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(22,163,74,.10), transparent 60%),
        radial-gradient(100% 80% at 100% 0%, rgba(20,83,45,.10), transparent 55%),
        #f7f6f3;
    }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, rgba(20,83,45,.97), rgba(6,54,30,.97));
      color: #fff;
      padding: 16px 20px 14px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .logo { height: 26px; width: auto; border-radius: 6px; display: block; }
    .header-text { flex: 1; min-width: 0; }
    .header-title { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .header-sub { font-size: 11px; opacity: .6; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .role-chip {
      font-size: 10px; font-weight: 650; padding: 3px 9px; border-radius: 99px;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.14);
      color: #fff; white-space: nowrap;
    }
    .settings-btn {
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px; color: rgba(255,255,255,.8);
      cursor: pointer; padding: 5px 8px; font-size: 15px; line-height: 1;
      transition: background .15s ease, transform .15s cubic-bezier(0.23,1,0.32,1);
    }
    .settings-btn:hover { background: rgba(255,255,255,.24); color: #fff; }
    .settings-btn:active { transform: scale(0.94); }

    /* ---- Not connected banner ---- */
    #not-connected {
      background: rgba(255,247,237,.9); border-bottom: 1px solid rgba(254,215,170,.8);
      padding: 12px 20px; display: none; align-items: center; gap: 10px;
    }
    #not-connected span { flex: 1; font-size: 13px; color: #9a3412; }
    #not-connected button {
      background: #ea580c; color: #fff; border: none;
      border-radius: 8px; padding: 6px 13px; font-size: 12px;
      font-weight: 650; cursor: pointer;
      transition: background .15s ease, transform .15s cubic-bezier(0.23,1,0.32,1);
    }
    #not-connected button:active { transform: scale(0.96); }

    /* ---- Tabs ---- */
    .tabs { display: flex; gap: 4px; padding: 12px 20px 0; }
    .tab {
      flex: 1; text-align: center; padding: 9px 0; font-size: 12.5px; font-weight: 650;
      color: #78716c; background: transparent; border: none;
      border-radius: 11px 11px 0 0; cursor: pointer;
      transition: color .15s ease, background .15s ease;
    }
    .tab.active {
      color: #14532d;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.9); border-bottom: none;
    }
    .tab:not(.active):hover { color: #44403c; }

    .panel { display: none; animation: fade-in .22s cubic-bezier(0.23,1,0.32,1) both; }
    .panel.active { display: block; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ---- Form body ---- */
    .body {
      padding: 18px 20px 20px;
      background: rgba(255,255,255,.75);
      border-top: 1px solid rgba(255,255,255,.9);
    }

    .field { margin-bottom: 13px; }
    label { display: block; font-size: 10.5px; font-weight: 650; color: #78716c; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    input, select, textarea {
      width: 100%; padding: 9px 12px;
      border: 1px solid rgba(0,0,0,.10); border-radius: 10px;
      background: rgba(255,255,255,.9); font-size: 13px; color: #1c1917;
      outline: none; transition: border-color .15s, box-shadow .15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,.14);
    }
    textarea { resize: vertical; min-height: 64px; line-height: 1.5; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .source-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(240,253,244,.9); border: 1px solid rgba(187,247,208,.9);
      border-radius: 99px; padding: 4px 10px;
      font-size: 11px; color: #166534; margin-top: 5px;
      max-width: 100%; overflow: hidden;
    }
    .source-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .hint-sm { font-size: 11.5px; color: #a8a29e; margin: -6px 0 14px; line-height: 1.5; }

    /* ---- Footer / save button ---- */
    .footer {
      padding: 0 20px 18px;
      background: rgba(255,255,255,.75);
    }
    .primary-btn {
      width: 100%; padding: 11px;
      background: linear-gradient(135deg, #14532d, #0b3d20); color: #fff;
      border: 1px solid rgba(255,255,255,.10); border-radius: 12px;
      font-size: 14px; font-weight: 650; letter-spacing: -.01em;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(20,83,45,.20), 0 8px 20px rgba(20,83,45,.16);
      transition: box-shadow .18s ease, opacity .15s ease, transform .15s cubic-bezier(0.23,1,0.32,1);
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .primary-btn:hover:not(:disabled) { box-shadow: 0 2px 6px rgba(20,83,45,.24), 0 12px 28px rgba(20,83,45,.26); }
    .primary-btn:active:not(:disabled) { transform: scale(0.98); }
    .primary-btn:disabled { opacity: .5; cursor: default; box-shadow: none; }

    /* ---- Status ---- */
    #status {
      margin: 10px 20px 0;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    #status.success { background: rgba(240,253,244,.95); color: #166534; border: 1px solid rgba(187,247,208,.9); }
    #status.error   { background: rgba(255,241,242,.95); color: #9f1239; border: 1px solid rgba(254,205,211,.9); }

    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .7s linear infinite; display: inline-block; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <div class="header">
    <img class="logo" src="../assets/wordmark.png" alt="Eden Labs" />
    <div class="header-text">
      <div class="header-title">Eden Labs</div>
      <div class="header-sub" id="header-sub">Chrome Extension</div>
    </div>
    <span class="role-chip" id="role-chip" style="display:none"></span>
    <button class="settings-btn" id="open-settings" title="Settings">⚙</button>
  </div>

  <div id="not-connected">
    <span>Not connected — enter your PIN to get started.</span>
    <button id="connect-btn">Connect</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-lead" data-panel="panel-lead">Save Lead</button>
    <button class="tab" id="tab-outreach" data-panel="panel-outreach">Log Outreach</button>
  </div>

  <div id="status"></div>

  <!-- ══ Save Lead ══ -->
  <div class="panel active" id="panel-lead">
    <div class="body">
      <div class="field">
        <label>Name *</label>
        <input id="name" type="text" placeholder="Full name" autocomplete="off" />
      </div>

      <div class="row">
        <div class="field">
          <label>Company</label>
          <input id="company" type="text" placeholder="Company name" />
        </div>
        <div class="field">
          <label>Title / Role</label>
          <input id="title" type="text" placeholder="e.g. CFO" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Stage</label>
          <!-- These values must match the dashboard's CRM stages exactly. This
               list used to offer "qualified", which is not a real stage — a lead
               saved that way rendered in no column on the CRM board at all and
               couldn't be recovered through the UI. -->
          <select id="stage">
            <option value="lead">Lead</option>
            <option value="call_booked">Call booked</option>
            <option value="proposal_sent">Proposal sent</option>
            <option value="closed">Closed won</option>
          </select>
        </div>
        <div class="field">
          <label>Est. deal value ($)</label>
          <input id="deal-value" type="number" placeholder="e.g. 3500" min="0" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="email@company.com" />
        </div>
        <div class="field">
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="+1 555 000 0000" />
        </div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notes" placeholder="Anything worth remembering…"></textarea>
      </div>

      <div class="field" id="source-field" style="display:none">
        <label>Source URL</label>
        <div class="source-chip">
          <span>🔗</span>
          <span id="source-url-display"></span>
        </div>
      </div>
    </div>
    <div class="footer">
      <button class="primary-btn" id="save-lead-btn">Save to CRM</button>
    </div>
  </div>

  <!-- ══ Log Outreach ══ -->
  <div class="panel" id="panel-outreach">
    <div class="body">
      <div class="field">
        <label>Date</label>
        <input id="outreach-date" type="date" />
      </div>
      <p class="hint-sm" id="outreach-scope">Sets today's totals for LinkedIn outreach — this overwrites, so enter the full day's count, not just what changed.</p>

      <div class="row-4">
        <div class="field">
          <label>Connections sent</label>
          <input id="oc-sent" type="number" min="0" placeholder="0" />
        </div>
        <div class="field">
          <label>Accepted</label>
          <input id="oc-accepted" type="number" min="0" placeholder="0" />
        </div>
        <div class="field">
          <label>Conversations started</label>
          <input id="oc-convos" type="number" min="0" placeholder="0" />
        </div>
        <div class="field">
          <label>Replied</label>
          <input id="oc-replied" type="number" min="0" placeholder="0" />
        </div>
      </div>
      <div class="field">
        <label>Calls booked</label>
        <input id="oc-calls" type="number" min="0" placeholder="0" />
      </div>
    </div>
    <div class="footer">
      <button class="primary-btn" id="save-outreach-btn">Save outreach for this day</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
